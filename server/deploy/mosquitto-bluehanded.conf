# Mosquitto config for Blue-Handed (copy to /etc/mosquitto/conf.d/bluehanded.conf).
# Step 2: plain MQTT with passwords. Step 9 adds the TLS listener below.

per_listener_settings true

# Plain MQTT on the exam network, password required.
listener 1883
allow_anonymous false
password_file /etc/mosquitto/passwd
acl_file /etc/mosquitto/bluehanded.acl

# ---- Step 9: TLS. Uncomment after running deploy/make_certs.sh, then
# ---- comment out the 1883 listener above so only encrypted traffic is accepted.
# listener 8883
# allow_anonymous false
# password_file /etc/mosquitto/passwd
# acl_file /etc/mosquitto/bluehanded.acl
# cafile /etc/mosquitto/certs/ca.crt
# certfile /etc/mosquitto/certs/server.crt
# keyfile /etc/mosquitto/certs/server.key
# tls_version tlsv1.2
