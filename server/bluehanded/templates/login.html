{% extends "base.html" %}
{% block title %}Log in · Blue-Handed{% endblock %}
{% block body %}
<section class="card login">
  <h1>Proctor log in</h1>
  {% if no_users %}
  <p class="hint">No accounts exist yet. On the Raspberry Pi run:<br>
    <code>python -m bluehanded create-user admin --role admin</code></p>
  {% endif %}
  <form method="post">
    <label>Username <input name="username" autocomplete="username" required autofocus></label>
    <label>Password <input name="password" type="password" autocomplete="current-password" required></label>
    <button class="primary">Log in</button>
  </form>
</section>
{% endblock %}
