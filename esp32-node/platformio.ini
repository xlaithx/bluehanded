[env]
platform = espressif32@8.0.0
board = esp32dev
framework = arduino
monitor_speed = 115200

; Test programs (see README). Each env builds exactly one file from src/.
[env:esp32dev]
build_src_filter = +<*> -<wifi_test.cpp> -<mqtt_test.cpp> -<node.cpp>

[env:wifi_test]
build_src_filter = +<*> -<main.cpp> -<mqtt_test.cpp> -<node.cpp>

[env:mqtt_test]
build_src_filter = +<*> -<main.cpp> -<wifi_test.cpp> -<node.cpp>
lib_deps = knolleary/PubSubClient@2.8

; Final Blue-Handed node firmware: BLE scan + Wi-Fi + MQTT (src/node.cpp).
; BLE and Wi-Fi together do not fit the default 1.2 MB app partition,
; so this env uses the 3 MB "huge_app" partition table (no OTA).
[env:node]
build_src_filter = +<node.cpp>
board_build.partitions = huge_app.csv
lib_deps =
    knolleary/PubSubClient@2.8
    bblanchon/ArduinoJson@^7.2.0
